<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cronòmetre Pro - Detecció de Tors Sync</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    h1 { margin-bottom: 5px; font-size: 1.2rem; }
    #canvas {
      width: 95%;
      max-width: 500px;
      border-radius: 12px;
      background: #000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }
    button {
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: white;
    }
    #startBtn { background-color: #28a745; }
    #stopBtn { background-color: #dc3545; }
    button:disabled { background-color: #555; cursor: not-allowed; }
  </style>
</head>
<body>

  <h1>Cronòmetre Pro (Detecció de Tors)</h1>
  <canvas id="canvas" width="640" height="480"></canvas>

  <div class="controls">
    <button id="startBtn">INICIAR PREPARACIÓ</button>
    <button id="stopBtn" disabled>ATURAR</button>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');

    let mediaRecorder;
    let recordedChunks = [];
    let videoElement = document.createElement('video');

    let statusText = "A punt";
    let prepTimer = 30;
    let raceStartTime = 0;
    let elapsedTime = "00:00.00";
    let officialTime = null; // Guardar la marca d'arribada
    let isRacing = false;
    let raceFinished = false;

    const finishLineX = 320; 
    let audioCtx = null;

    // Generador de tons d'àudio ultra-ràpids per evitar retards de veu
    function playBeep(freq, duration, type = 'sine') {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      
      if (type === 'sawtooth') {
        osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      }

      gain.gain.setValueAtTime(1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    // Configuració de MediaPipe
    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    pose.onResults(onResults);

    function onResults(results) {
      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

      // Línia de Meta
      ctx.strokeStyle = officialTime ? "#00FF00" : "#FF0000";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(finishLineX, 0);
      ctx.lineTo(finishLineX, canvas.height);
      ctx.stroke();

      // Detecció del Tors
      if (results.poseLandmarks && isRacing && !officialTime) {
        const leftShoulder = results.poseLandmarks[11];
        const rightShoulder = results.poseLandmarks[12];

        if (leftShoulder && rightShoulder) {
          const torsoX = ((leftShoulder.x + rightShoulder.x) / 2) * canvas.width;
          const torsoY = ((leftShoulder.y + rightShoulder.y) / 2) * canvas.height;

          ctx.fillStyle = "#FFFF00";
          ctx.beginPath();
          ctx.arc(torsoX, torsoY, 8, 0, 2 * Math.PI);
          ctx.fill();

          // Creuar la línia
          if (torsoX >= finishLineX - 10 && torsoX <= finishLineX + 10) {
            officialTime = elapsedTime; // Congelar MARCA
            statusText = "META ASSOLIDA!";
          }
        }
      }

      // El cronòmetre SEMPRE segueix comptant si la cursa està activa
      if (isRacing) {
        const now = performance.now();
        const diff = new Date(now - raceStartTime);
        const m = String(diff.getUTCMinutes()).padStart(2, '0');
        const s = String(diff.getUTCSeconds()).padStart(2, '0');
        const ms = String(Math.floor(diff.getUTCMilliseconds() / 10)).padStart(2, '0');
        elapsedTime = `${m}:${s}.${ms}`;
      }

      // Panell d'Informació
      ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
      ctx.fillRect(10, 10, 310, officialTime ? 100 : 75);

      ctx.fillStyle = "#FFD700";
      ctx.font = "bold 18px Arial";
      ctx.fillText(statusText, 20, 35);

      // Temps en directe (segueix corrent)
      ctx.fillStyle = "#00FF00";
      ctx.font = "bold 26px monospace";
      ctx.fillText(`TEMPS: ${elapsedTime}`, 20, 68);

      // Si s'ha creuat la línia, mostra la MARCA OFICIAL al costat/a baix
      if (officialTime) {
        ctx.fillStyle = "#00E5FF";
        ctx.font = "bold 20px monospace";
        ctx.fillText(`MARCA: ${officialTime}`, 20, 95);
      }

      ctx.restore();
    }

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await pose.send({ image: videoElement });
      },
      width: 640,
      height: 480,
      facingMode: 'user'
    });
    camera.start();

    startBtn.addEventListener('click', () => {
      startBtn.disabled = true;
      stopBtn.disabled = false;
      officialTime = null;
      recordedChunks = [];
      elapsedTime = "00:00.00";

      const canvasStream = canvas.captureStream(30);
      mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm' });
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = saveVideo;
      mediaRecorder.start();

      startPreparation();
    });

    function startPreparation() {
      prepTimer = 30;
      statusText = `Preparació: ${prepTimer}s`;

      const interval = setInterval(() => {
        prepTimer--;
        statusText = `Preparació: ${prepTimer}s`;
        if (prepTimer <= 0) {
          clearInterval(interval);
          triggerProStart();
        }
      }, 1000);
    }

    function triggerProStart() {
      // READY -> Tò greu sincronitzat
      statusText = "READY";
      playBeep(440, 0.4); 

      setTimeout(() => {
        // SET -> Tò agut sincronitzat (5 segons després)
        statusText = "SET";
        playBeep(600, 0.4); 

        const randomDelay = Math.random() * 2000 + 1000; // Entre 1s i 3s

        setTimeout(() => {
          // GO! -> Pistolada i cronòmetre sincronitzats al mateix instant
          playBeep(250, 0.3, 'sawtooth'); 
          statusText = "GO!";
          raceStartTime = performance.now();
          isRacing = true;
        }, randomDelay);

      }, 5000);
    }

    stopBtn.addEventListener('click', () => {
      isRacing = false;
      statusText = "Finalitzat";
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
      }
      startBtn.disabled = false;
      stopBtn.disabled = true;
    });

    function saveVideo() {
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `cursa_${Date.now()}.webm`;
      a.click();
    }
  </script>
</body>
</html>
