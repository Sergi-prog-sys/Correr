<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cronòmetre d'Atletisme Pro</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    h1 { margin-bottom: 10px; font-size: 1.5rem; }
    #canvas {
      width: 90%;
      max-width: 400px;
      border-radius: 12px;
      background: #000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }
    button {
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: white;
    }
    #startBtn { background-color: #28a745; }
    #stopBtn { background-color: #dc3545; }
    #startBtn:disabled, #stopBtn:disabled { background-color: #555; cursor: not-allowed; }
  </style>
</head>
<body>

  <h1>Cronòmetre de Cursa Pro</h1>
  <canvas id="canvas" width="640" height="480"></canvas>

  <div class="controls">
    <button id="startBtn">INICIAR PREPARACIÓ</button>
    <button id="stopBtn" disabled>ATURAR</button>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');

    let videoStream, mediaRecorder;
    let recordedChunks = [];
    let videoElement = document.createElement('video');
    videoElement.playsInline = true;

    // Estat de la cursa
    let statusText = "A punt";
    let prepTimer = 30;
    let raceStartTime = 0;
    let elapsedTime = "00:00.00";
    let isRunning = false;
    let isRacing = false;

    // Síntesi de veu per a "Ready" i "Set", i beep per a "Go"
    function speak(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 1;
      window.speechSynthesis.speak(utterance);
    }

    function playGunshot() {
      const ctxAudio = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctxAudio.createOscillator();
      const gain = ctxAudio.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(300, ctxAudio.currentTime);
      osc.frequency.exponentialRampToValueAtTime(0.01, ctxAudio.currentTime + 0.3);
      gain.gain.setValueAtTime(1, ctxAudio.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctxAudio.currentTime + 0.3);
      osc.connect(gain);
      gain.connect(ctxAudio.destination);
      osc.start();
      osc.stop(ctxAudio.currentTime + 0.3);
    }

    // Inicialitzar càmera frontal (facingMode: "user")
    async function initCamera() {
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
          audio: true
        });
        videoElement.srcObject = videoStream;
        videoElement.play();
        requestAnimationFrame(drawCanvas);
      } catch (err) {
        alert("Error en accedir a la càmera frontal: " + err.message);
      }
    }

    // Dibuixar la càmera i el cronòmetre al canvas
    function drawCanvas() {
      ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

      // Calcular temps de cursa si ha començat
      if (isRacing) {
        const now = performance.now();
        const diff = new Date(now - raceStartTime);
        const m = String(diff.getUTCMinutes()).padStart(2, '0');
        const s = String(diff.getUTCSeconds()).padStart(2, '0');
        const ms = String(Math.floor(diff.getUTCMilliseconds() / 10)).padStart(2, '0');
        elapsedTime = `${m}:${s}.${ms}`;
      }

      // Caixeta per al text
      ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
      ctx.fillRect(10, 10, 280, 70);

      // Dibuixar Estat/Compte enrere
      ctx.fillStyle = "#FFD700";
      ctx.font = "bold 20px Arial";
      ctx.fillText(statusText, 20, 35);

      // Dibuixar Cronòmetre
      ctx.fillStyle = "#00FF00";
      ctx.font = "bold 28px monospace";
      ctx.fillText(elapsedTime, 20, 68);

      requestAnimationFrame(drawCanvas);
    }

    // Iniciar el procés
    startBtn.addEventListener('click', () => {
      startBtn.disabled = true;
      stopBtn.disabled = false;
      recordedChunks = [];

      // Gravar el canvas (inclou imatge + overlay de text)
      const canvasStream = canvas.captureStream(30);
      if (videoStream.getAudioTracks().length > 0) {
        canvasStream.addTrack(videoStream.getAudioTracks()[0]);
      }

      mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm' });
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = saveVideo;
      mediaRecorder.start();

      startPreparation();
    });

    function startPreparation() {
      prepTimer = 30;
      isRunning = true;
      statusText = `Preparació: ${prepTimer}s`;

      const interval = setInterval(() => {
        prepTimer--;
        statusText = `Preparació: ${prepTimer}s`;
        if (prepTimer <= 0) {
          clearInterval(interval);
          triggerProStart();
        }
      }, 1000);
    }

    function triggerProStart() {
      // 1. READY
      statusText = "READY";
      speak("Ready");

      // 2. Esperar 5 segons exactes per al SET
      setTimeout(() => {
        statusText = "SET";
        speak("Set");

        // 3. Temps variable entre 1 i 3 segons per al GO
        const randomDelay = Math.random() * 2000 + 1000; // 1000ms a 3000ms

        setTimeout(() => {
          // 4. GO!
          playGunshot();
          statusText = "GO!";
          raceStartTime = performance.now();
          isRacing = true;
        }, randomDelay);

      }, 5000);
    }

    // Aturar i guardar vídeo
    stopBtn.addEventListener('click', () => {
      isRacing = false;
      statusText = "Finalitzat";
      mediaRecorder.stop();
      startBtn.disabled = false;
      stopBtn.disabled = true;
    });

    function saveVideo() {
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `cursa_${Date.now()}.webm`;
      a.click();
    }

    window.onload = initCamera;
  </script>
</body>
</html>
