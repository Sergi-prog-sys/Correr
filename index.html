<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cronòmetre de Cursa Pro</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    h1 { margin-bottom: 5px; font-size: 1.2rem; }
    #canvas {
      width: 95%;
      max-width: 500px;
      border-radius: 12px;
      background: #000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }
    button {
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: white;
    }
    #startBtn { background-color: #28a745; }
    #stopBtn { background-color: #dc3545; }
    button:disabled { background-color: #555; cursor: not-allowed; }
  </style>
</head>
<body>

  <h1>Cronòmetre de Cursa (10s)</h1>
  <canvas id="canvas" width="640" height="480"></canvas>

  <div class="controls">
    <button id="startBtn">INICIAR PREPARACIÓ</button>
    <button id="stopBtn" disabled>ATURAR MANUAL</button>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');

    let videoElement = document.createElement('video');
    videoElement.playsInline = true;

    let mediaRecorder;
    let recordedChunks = [];

    let statusText = "A punt";
    let prepTimer = 30;
    let raceStartTime = 0;
    let elapsedTime = "00:00.00";
    let isRacing = false;

    const finishLineX = 320; // Línia visual vermella
    let audioCtx = null;

    // Generador de so intern (Funciona SEMPRE en qualsevol mòbil)
    function produceSound(frequency, duration, type = 'sine') {
      if (!audioCtx) return;
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = type;
      osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
      
      gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    // Inicialitzar la càmera frontal
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
          audio: true
        });
        videoElement.srcObject = stream;
        videoElement.play();
        requestAnimationFrame(drawCanvas);
      } catch (err) {
        alert("Error en accedir a la càmera: " + err.message);
      }
    }

    function drawCanvas() {
      // 1. Dibuixar vídeo de la càmera
      ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

      // 2. Dibuixar línia vermella al centre
      ctx.strokeStyle = "#FF0000";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(finishLineX, 0);
      ctx.lineTo(finishLineX, canvas.height);
      ctx.stroke();

      // 3. Cronòmetre en directe
      if (isRacing) {
        const now = performance.now();
        const diff = new Date(now - raceStartTime);
        const m = String(diff.getUTCMinutes()).padStart(2, '0');
        const s = String(diff.getUTCSeconds()).padStart(2, '0');
        const ms = String(Math.floor(diff.getUTCMilliseconds() / 10)).padStart(2, '0');
        elapsedTime = `${m}:${s}.${ms}`;
      }

      // 4. Interfície de text sobre el vídeo
      ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
      ctx.fillRect(10, 10, 310, 75);

      ctx.fillStyle = "#FFD700";
      ctx.font = "bold 18px Arial";
      ctx.fillText(statusText, 20, 35);

      ctx.fillStyle = "#00FF00";
      ctx.font = "bold 26px monospace";
      ctx.fillText(`TEMPS: ${elapsedTime}`, 20, 68);

      requestAnimationFrame(drawCanvas);
    }

    startBtn.addEventListener('click', () => {
      // Activar el xip d'àudio del mòbil al fer clic
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      startBtn.disabled = true;
      stopBtn.disabled = false;
      recordedChunks = [];
      elapsedTime = "00:00.00";

      startPreparation();
    });

    function startPreparation() {
      prepTimer = 30;
      statusText = `Preparació: ${prepTimer}s`;

      const interval = setInterval(() => {
        prepTimer--;
        statusText = `Preparació: ${prepTimer}s`;
        if (prepTimer <= 0) {
          clearInterval(interval);
          triggerProStart();
        }
      }, 1000);
    }

    function triggerProStart() {
      // 1. READY (Senyal sonor 1)
      statusText = "READY";
      produceSound(440, 0.5, 'sine'); // So greu 440Hz

      setTimeout(() => {
        // 2. SET (Senyal sonor 2) passats 5 segons
        statusText = "SET";
        produceSound(660, 0.5, 'sine'); // So agut 660Hz

        const randomDelay = Math.random() * 2000 + 1000; // Entre 1s i 3s

        setTimeout(() => {
          // 3. GO! (Pistolada + Cronòmetre + Iniciar gravació)
          produceSound(150, 0.6, 'sawtooth'); // So tipus pistolada
          raceStartTime = performance.now();
          isRacing = true;
          statusText = "GO!";

          startRecording();

          // Aturar la gravació automàticament passats 10 segons exactes
          setTimeout(() => {
            stopRace();
          }, 10000);

        }, randomDelay);

      }, 5000);
    }

    function startRecording() {
      const canvasStream = canvas.captureStream(30);
      mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm' });
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = saveVideo;
      mediaRecorder.start();
    }

    function stopRace() {
      isRacing = false;
      statusText = "Finalitzat (10s)";
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
      }
      startBtn.disabled = false;
      stopBtn.disabled = true;
    }

    stopBtn.addEventListener('click', stopRace);

    function saveVideo() {
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `cursa_${Date.now()}.webm`;
      a.click();
    }

    window.onload = initCamera;
  </script>
</body>
</html>
